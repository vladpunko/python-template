[build-system]
requires = ["poetry-core>=2.5,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.10,<2.0"

[project]
name = "python_template"
version = "0.0.0"
description = "python_template"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
authors = [
  {name = "Vladislav Punko", email = "iam.vlad.punko@gmail.com"},
]
maintainers = []
classifiers = []  # see information: https://pypi.org/classifiers
keywords = []
dependencies = [  # see information: https://python-poetry.org/docs/dependency-specification
  "loguru (>=0.7,<1.0)",
]

[project.optional-dependencies]
cpu = [
  "numpy (>=2.5.4,<3.0)",
  "torch (==2.15.0) ; sys_platform == 'darwin'",
  "torch (==2.15.0+cpu) ; sys_platform == 'linux' or sys_platform == 'win32'",
]
cuda = [
  "numpy (>=2.5.4,<3.0)",
  "torch (==2.15.0+cu134) ; sys_platform == 'linux'",
  # Align shared libraries with the selected PyTorch and CUDA toolkit builds.
  "nvidia-cublas (==13.8.1.7) ; sys_platform == 'linux'",
  "nvidia-cuda-nvrtc (==13.4.59) ; sys_platform == 'linux'",
  "nvidia-cusparse (==12.8.6.49) ; sys_platform == 'linux'",
]

[project.urls]
"Issue tracker" = "https://github.com/vladpunko/python-template/issues"
"Source code" = "https://github.com/vladpunko/python-template"

[tool.poetry]
requires-poetry = ">=2.5,<3.0"
package-mode = true
packages = [
  {include = "python_template", from = "src"},
]
include = ["CHANGELOG.md", "LICENSE", "README.md"]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
# ---
torch = [
  {markers = "extra == 'cpu' and extra != 'cuda' and (sys_platform == 'linux' or sys_platform == 'win32')", source = "pytorch_cpu"},
  {markers = "extra == 'cuda' and extra != 'cpu' and sys_platform == 'linux'", source = "pytorch_cuda"},
  # ---
  {markers = "extra == 'cpu' and extra != 'cuda' and sys_platform == 'darwin'", source = "pypi_public"},
]

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
numpydoc = "^1.11"
sphinx = "^9.2"
sphinx_rtd_theme = "^3.1"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
bandit = "^1.9.4"
black = "^26.10.1"
deptry = "^0.25.1"
flake8 = "^7.5"
isort = "^9.0.2"
mypy = "^2.4.1"
pre-commit = "^4.7"
ruff = "^0.17.4"
tox = "^4.67.11"
twine = "^7.0"

[tool.poetry.group.tests]
optional = true

[tool.poetry.group.tests.dependencies]
coverage = "^7.17.2"
pyfakefs = "^6.3.2"
pytest = "^9.2"
pytest-cov = "^7.1"
pytest-html = "^4.2"
pytest-mock = "^3.17"

[tool.poetry.group.notebooks]
optional = true

[tool.poetry.group.notebooks.dependencies]
jupyter = "^1.1"

[tool.poetry.group.profiling]
optional = true

[tool.poetry.group.profiling.dependencies]
snakeviz = "^2.2"

[[tool.poetry.source]]
name = "pypi_public"
priority = "primary"
url = "https://pypi.org/simple/"

[[tool.poetry.source]]
name = "pytorch_cpu"
priority = "explicit"
url = "https://download.pytorch.org/whl/cpu"

[[tool.poetry.source]]
name = "pytorch_cuda"
priority = "explicit"
url = "https://download.pytorch.org/whl/cu134"

[tool.pytest.ini_options]
addopts = [
  "-vv",
  "-x",  # exit instantly on first error or failed test
  # ---
  "--cov-report=html",
  "--cov-report=term",
  "--cov",
  "--doctest-modules",
  "--durations=10",
  "--failed-first",
  "--import-mode=importlib",
  "--new-first",
  # ---
  "--html=./.pytest_report/index.html",
]
testpaths = ["src/python_template", "tests"]

[tool.coverage.run]
branch = true
omit = [
  "src/python_template/__about__.py",
]
parallel = true
source = ["src/python_template"]

[tool.coverage.report]
exclude_lines = [
  "@abc.abstractmethod",

  # We have to re-enable the standard pragma.
  "pragma: no cover",

  # Do not complain about missing debug-only code.
  "def __repr__",
  "if self.debug:",

  # No need to complain if tests do not hit defensive assertion code.
  "pass",
  "raise AssertionError",
  "raise NotImplementedError",
  "return NotImplemented",

  # Do not complain if non-runnable code is not run.
  "if __name__ == .__main__.:",
  "if 0:",
  "if False:",
]
show_missing = true

[tool.black]
target-version = ["py313"]

[tool.bandit]
exclude_dirs = [
  "docs/",
  "tests/",
]

[tool.deptry]
extend_exclude = [
  "^docs/",
  "^examples/",
  "^tests/",
]
known_first_party = []

[tool.deptry.per_rule_ignores]
# Optional ML libraries support the example notebook, not the core API.
DEP002 = ["numpy", "torch", "nvidia-cublas", "nvidia-cuda-nvrtc", "nvidia-cusparse"]

[tool.isort]
profile = "black"
known_first_party = []
known_local_folder = ["python_template"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
exclude = ["\\.pyi$"]
strict = true

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["*.pyi", "docs/", "tests/"]

[tool.ruff.lint]
select = ["A", "B", "C", "E", "F", "N", "W"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
