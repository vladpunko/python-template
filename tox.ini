[tox]
envlist = py{313,314,315}

# Use a virtual environment to build a source distribution from the source tree.
isolated_build = true

# Ignore errors related to absence of some python interpreters on the current machine.
skip_missing_interpreters = {env:TOX_SKIP_MISSING_INTERPRETERS:True}

[testenv]
description = "Execute the test driver using {basepython}."
allowlist_externals = {env:POETRY:poetry}
commands_pre = {env:POETRY:poetry} install --only main,tests --no-root --no-interaction
commands = python -m pytest

[testenv:docs]
description = "Build the documentation."
setenv = PYTHONHASHSEED=0
commands_pre = {env:POETRY:poetry} install --only main,docs --no-root --no-interaction
commands =
    # Generate the documentation and output it in html format.
    python -m sphinx -E -W --builder=html docs {toxworkdir}/docs/html

[testenv:lint]
description = "Check the code style."
allowlist_externals =
    git
    {env:POETRY:poetry}
commands_pre = {env:POETRY:poetry} install --only main,dev --no-root --no-interaction
commands =
    pre-commit run --all-files --show-diff-on-failure --config .githooks.yml

    # The process will fail if files undergo modifications at the end.
    git diff --exit-code
skip_install = true
