name: python testing and linting

on:
  push:
    branches:
      - "master"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]

    steps:
      - name: Step -- 1.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Step -- 2.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Step -- 3.
        run: python -m pip install 'poetry==2.5.1' 'poetry-plugin-export==1.10.1'

      - name: Step -- 4.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: tests-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Step -- 5.
        run: make tests

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Step -- 1.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Step -- 2.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Step -- 3.
        run: python -m pip install 'poetry==2.5.1' 'poetry-plugin-export==1.10.1'
      - name: Step -- 4.
        run: |
          make build
          poetry install --only main,dev --no-interaction
          poetry run twine check --strict dist/*
      - name: Step -- 5.
        run: |
          python -m venv "$RUNNER_TEMP/package-test"
          "$RUNNER_TEMP/package-test/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/package-test/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-test/bin/python" -c "import python_template.api"
